<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explora series de televisión con información de TVmaze."
    />
    <title>Series Explorer</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Tu catálogo de televisión</p>
      <h1>Series Explorer</h1>
      <p class="intro">Busca y explora series de televisión.</p>
    </header>

    <main class="page-content">
      <p id="status-message" class="status-message" role="status" aria-live="polite">
        Preparando el catálogo…
      </p>

      <section
        id="shows-grid"
        class="shows-grid"
        aria-label="Catálogo de series"
      ></section>
    </main>

    <footer class="site-footer">
      <p>
        Datos de series proporcionados por
        <a href="https://www.tvmaze.com/" target="_blank" rel="noreferrer">TVmaze</a>.
      </p>
    </footer>
  </body>
</html>
